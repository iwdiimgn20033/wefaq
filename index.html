<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<title>ميزان الوفاق الزوجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a single centered column of "letters" — one axis per screen, two rating rows per statement, report as paired columns */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#14302e; --muted:#5b716e; --line:#d5dfdc;
  --accent:#b2384f; --accent-soft:#f6e3e7; --teal:#1f6b62; --teal-soft:#dcece8;
  --ok:#2f7d4f; --minor:#9a8a1f; --mid:#c27a1a; --big:#c4502a; --crit:#a3203a;
  color-scheme:light;
  --display:"Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:clamp(1.5rem,4vw,2rem);color:var(--teal)}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.82rem;letter-spacing:.04em;color:var(--accent);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;cursor:pointer;border-radius:10px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--teal);border-color:var(--teal);color:var(--surface);font-weight:600}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.formula{font-family:var(--display);font-size:1.05rem;background:var(--teal-soft);border-radius:10px;padding:12px 16px;text-align:center}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;font-size:.9rem}
.legend span{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.names{grid-template-columns:1fr}}

/* progress */
.progress{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* items: compact table-like rows, three answer cells per statement */
.qhead,.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 64px;gap:6px 12px;align-items:center}
.qhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;border-bottom:1px solid var(--line);font-size:.76rem;font-weight:600;color:var(--muted)}
.qhead span{display:flex;flex-direction:column;line-height:1.3;text-align:center}
.qhead span:first-child{text-align:start}
.qhead small{font-weight:400;font-size:.66rem}
.qhead span:nth-child(2),.sc.a{width:146px}.qhead span:nth-child(3),.sc.i{width:146px}
.qgroup{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px}
.qgroup h3{font-size:.95rem;color:var(--teal);padding-block:8px 4px}
.qrow{padding-block:7px;border-top:1px solid var(--line)}
.qrow.missing{background:var(--accent-soft);border-radius:8px;outline:1px solid var(--accent)}
.qt{font-size:.93rem;line-height:1.5}
.negtag{font-size:.66rem;color:var(--accent);border:1px solid currentColor;border-radius:10px;padding:0 6px;margin-inline-start:6px;white-space:nowrap}
.sc{display:grid;grid-template-columns:repeat(5,26px);gap:4px;justify-content:center}
.sc input{position:absolute;opacity:0;pointer-events:none}
.sc label{height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:.8rem;font-variant-numeric:tabular-nums}
.sc input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.sc.a input:checked+label{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.sc.i input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.qw,.qhead span:last-child{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;border-inline-start:2px solid var(--line);padding-inline-start:10px;gap:2px}
.qw b{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.tier{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:3px 10px;border-radius:6px;font-size:.74rem;font-weight:600;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.tier b{font-variant-numeric:tabular-nums}
.tier+.qrow{border-top:0}
.wdots{font-size:.6rem;letter-spacing:1px;color:var(--mid);direction:ltr;white-space:nowrap}
.wdots i{font-style:normal;color:var(--line)}
@media (max-width:620px){
 .qhead,.qrow{grid-template-columns:auto auto minmax(0,1fr)}
 .qhead span:first-child{display:none}
 .qrow .qt{grid-column:1/-1}
 .qhead span:nth-child(2),.sc.a,.qhead span:nth-child(3),.sc.i{width:auto}
 .sc{grid-template-columns:repeat(5,24px);gap:3px}.sc label{height:24px}
}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.err{color:var(--accent);font-weight:600}
.hdr{display:flex;flex-direction:column;gap:4px}
.phone{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px}
.loginbox{max-width:560px;width:100%;margin-inline:auto;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:999px;padding:4px}
.seg button{box-shadow:none;border:0;background:transparent;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--teal);box-shadow:0 1px 2px var(--shadow),0 4px 12px var(--shadow)}
.loginrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
@media (max-width:420px){.loginrow{grid-template-columns:1fr}}
.rolebox{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.rolebox input{position:absolute;opacity:0;pointer-events:none}
.rolebox label{display:flex;align-items:center;justify-content:center;padding:6px 16px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted);min-width:64px}
.rolebox input:checked+label{background:var(--teal);color:var(--surface);box-shadow:0 2px 8px var(--shadow-strong)}
.rolebox input[value=w]:checked+label{background:var(--accent)}
.rolebox input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
button.big{min-height:48px;font-size:1.02rem}
.mecard .who{align-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.phone select{width:auto;max-width:150px}
#app,#journalView{display:flex;flex-direction:column;gap:12px}
#app[hidden],#journalView[hidden]{display:none}
.sbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sbar button{padding:6px 12px;font-size:.88rem;display:flex;gap:6px;align-items:center}
.sbar button small{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sbar button.on{background:var(--teal);border-color:var(--teal);color:var(--surface)}.sbar button.on small{color:var(--surface)}
.sbar .sp{flex:1}

.pages{display:flex;gap:6px}
.pg{padding:2px 10px;border-radius:8px;font-weight:600;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.pg small{font-size:.68rem;color:var(--accent);font-weight:600}
.pg.full small{color:var(--ok)}
.pg.on{background:var(--teal);border-color:var(--teal);color:var(--surface)}.pg.on small{color:var(--surface)}
.kpis{display:flex;gap:24px;flex-wrap:wrap}
.axes{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}

/* report */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.cols>*{min-width:0}
.big{font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.band{display:inline-block;padding:2px 12px;border-radius:20px;font-size:.85rem;font-weight:600;background:var(--teal-soft);color:var(--teal)}
.axis{display:flex;flex-direction:column;gap:4px}
.axis .row{display:flex;justify-content:space-between;font-size:.92rem;gap:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
ol.needs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:n}
ol.needs li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:8px;counter-increment:n}
ol.needs li::before{content:counter(n);font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
ol.needs li>div{min-width:0}
.pts{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
.pts small{display:block;font-family:var(--body);font-size:.68rem;font-weight:600}
.sub{font-size:.8rem;color:var(--muted)}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.note{font-size:.88rem;color:var(--muted);border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.tag-sample{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.9rem}
/* tabs + journal */
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tabs a[aria-selected="true"]{color:var(--teal);border-bottom-color:var(--teal)}
.badge{background:var(--accent);color:var(--surface);border-radius:12px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;padding:0 6px;font-variant-numeric:tabular-nums}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{padding:7px 14px;border-radius:20px;font-size:.92rem;display:flex;gap:6px;align-items:center}
.subtabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--display);font-size:1.7rem;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{border:1px solid var(--line);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:.92rem}
.chips input:checked+label{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chips input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
textarea,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
.preview{background:var(--accent-soft);border-radius:10px;padding:12px 16px;font-size:1.02rem}
.issue{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.issue.hot{border-inline-start:4px solid var(--accent)}
.issue .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
.pill{border-radius:20px;padding:1px 10px;font-size:.78rem;font-weight:600;border:1px solid currentColor}
.reply{background:var(--teal-soft);border-radius:10px;padding:10px 14px;font-size:.95rem}
.sev{letter-spacing:2px;color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.two{grid-template-columns:1fr}}
.two>*{min-width:0}
.score10{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.score10 input{position:absolute;opacity:0;pointer-events:none}
.score10 label{border:1px solid var(--line);border-radius:8px;text-align:center;padding:8px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.score10 input:checked+label{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.score10 input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.code{font-family:var(--display);font-size:1.6rem;letter-spacing:.2em;direction:ltr;display:inline-block;background:var(--teal-soft);padding:4px 14px;border-radius:10px;user-select:all}
a.wa{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 18px;background:var(--ok);color:var(--surface);text-decoration:none;font-weight:600}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:420px;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:10px;z-index:20;max-width:90vw}
.langbox{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.langbox select{width:auto;padding:5px 8px;font-size:.85rem}
.paths{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:flex-end}
.path{font-size:.78rem;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.path b{font-weight:600}.path.on{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
.tblwrap{overflow-x:auto}
.sep{border-color:var(--crit)}.sep h2{color:var(--crit);font-size:1.15rem}
.kidsline{background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:6px 12px;font-size:.9rem;font-weight:600}
.kidsban{border-color:var(--teal)}
.kids{display:flex;flex-wrap:wrap;gap:6px}
.kid{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:2px 4px 2px 12px}
.kid button{padding:0 8px;border:0;font-size:1rem;line-height:1.4}
.kidadd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:480px){.kidadd{grid-template-columns:1fr 1fr}.kidadd button{grid-column:1/-1}}
.navbtn{padding:6px 12px;font-size:.85rem}.navbtn.in{border-color:var(--teal);color:var(--teal);direction:ltr;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
.sosbtn{background:var(--crit);border-color:var(--crit);color:var(--surface);font-weight:600;padding:6px 14px;font-size:.88rem}
.sosp{border:2px solid var(--crit)}
.timer{font-family:var(--display);font-size:2.6rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--crit)}
.kidsbox{border-color:var(--teal)}.kidsbox h3{color:var(--teal)}
.urgent{border:2px solid var(--crit);background:color-mix(in srgb,var(--crit) 8%,var(--surface));border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.urgent>div b{color:var(--crit)}
.urgbox{border:1px dashed var(--crit);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.urgbox input[type=checkbox]{width:18px;height:18px;accent-color:var(--crit)}
.pill.urg{color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent)}
.issue.isurg{border-color:var(--crit);border-inline-start:4px solid var(--crit)}
.urgbtn{border-color:var(--crit);color:var(--crit);font-weight:600}
.money{border:1px solid var(--big);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.money h3{color:var(--big)}
.pact{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding-block:8px;border-top:1px solid var(--line)}
.prow input{margin-top:5px;width:18px;height:18px;accent-color:var(--teal)}
.pst{font-size:.76rem;white-space:nowrap}
@media (max-width:520px){.prow{grid-template-columns:auto minmax(0,1fr)}.pst{grid-column:2}}
.reason{margin-top:6px;display:flex;flex-direction:column;gap:4px;font-size:.88rem;border-inline-start:2px solid var(--teal);padding-inline-start:10px}
.rwrite{display:flex;flex-direction:column;gap:4px}.rwrite textarea{min-height:48px;font-size:.88rem}.rwrite button{align-self:flex-start;padding:4px 12px;font-size:.82rem}
.tbl{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600;font-size:.8rem}
ol.agenda{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== modern skin: soft elevated surfaces, pill controls, real buttons ===== */
:root{--shadow:rgba(20,48,46,.08);--shadow-strong:rgba(20,48,46,.16);--chip:#f2f6f5;--teal-strong:#17564f;--radius:16px}

body{background:radial-gradient(1200px 500px at 100% -10%,var(--teal-soft),transparent 60%),var(--bg);background-attachment:fixed}
.panel,.qgroup,.stat,.issue{border-radius:var(--radius);border-color:transparent;box-shadow:0 1px 2px var(--shadow),0 6px 24px var(--shadow)}
.panel{padding:18px 20px}
.qgroup{padding:6px 16px 10px}
h1{letter-spacing:-.01em}

/* navigation as a floating segmented bar */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 border:0;border-radius:var(--radius);padding:6px;box-shadow:0 1px 2px var(--shadow),0 8px 28px var(--shadow)}
.tabs a{border:0;margin:0;border-radius:12px;padding:9px 16px;color:var(--muted);transition:background .15s,color .15s}
.tabs a:hover{background:var(--chip);color:var(--ink)}
.tabs a[aria-selected="true"]{background:var(--teal);color:var(--surface);box-shadow:0 2px 8px var(--shadow-strong)}
.tabs a[aria-selected="true"] .badge{background:var(--surface);color:var(--accent)}
.qhead{top:calc(env(safe-area-inset-top,0px) + 64px);border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* buttons that look and feel like buttons */
button,a.wa{font-weight:600;min-height:40px;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
 box-shadow:0 1px 2px var(--shadow),0 2px 6px var(--shadow);transition:transform .12s ease,box-shadow .12s ease,background .15s,border-color .15s}
button:hover:not(:disabled),a.wa:hover{transform:translateY(-1px);box-shadow:0 2px 4px var(--shadow),0 8px 18px var(--shadow-strong);border-color:var(--teal)}
button:active:not(:disabled),a.wa:active{transform:translateY(1px);box-shadow:0 1px 2px var(--shadow)}
button:disabled{opacity:.55;cursor:not-allowed}

  <span>العبارة</span><span>كم يحدث<small>1 أبداً · 5 دائماً</small></span><span>الأهمية لي<small>1 غير مهم · 5 أساسي</small></span><span>قوة النقطة<small>الوزن العالمي</small></span>
 </div>
 ${axes.map(ax=>`<section class="qgroup"><h3>${ax.title}</h3>
  ${ax.items.map((it,j)=>{const id=ax.id+j,v=S.ans[k][id]||[],tier=(j===0||ax.items[j-1].w!==it.w)?`<div class="tier" style="--tc:var(${it.w>=5?"--crit":it.w===4?"--big":it.w===3?"--mid":"--minor"})"><span>${TIER[it.w]}</span><b>${it.w}/5</b></div>`:"";return tier+`<div class="qrow" data-id="${id}">
   <div class="qt"><span class="qn">${numOf(k,id)}</span><span class="qtx">${it.t}${it.neg?`<span class="negtag">سلوك سلبي</span>`:""}</span></div>
   ${scale(k,id,"a",v[0])}${scale(k,id,"i",v[1])}<div class="qw">${wDots(it.w)}<b>${it.w}</b></div></div>`}).join("")}
 </section>`).join("")}
 <p class="err" id="err" ${S.showMiss?"":"hidden"}>لا يكتمل الاستبيان قبل الإجابة عن جميع الأسئلة. بقي: ${miss.map((n,pi)=>n?`الصفحة ${pi+1} (${n})`:"").filter(Boolean).join("، ")}.</p>
 <p class="sub">يمكنك التنقل بين الصفحات بحرية، والرقم الصغير على كل صفحة هو عدد الأسئلة المتبقية فيها.</p>
 <div class="nav"><button class="ghost" id="back">${S.page?"السابق":S.online?"العودة إلى البوابة":"العودة للبداية"}</button>

 app.querySelectorAll("input[type=radio]").forEach(inp=>inp.onchange=()=>{
  const row=inp.closest(".qrow"),id=row.dataset.id,ri=inp.name.endsWith("-i")?1:0,v=S.ans[k][id]||[0,0];
  v[ri]=+inp.value;S.ans[k][id]=v;save();if(S.online&&typeof onlineSave==="function")onlineSave(k);if(v[0]&&v[1])row.classList.remove("missing");
  $(".progress i").style.width=cnt()/total*100+"%"});

function analyse(k){
 const rows=[];let num=0,den=0;const axes=[];
 FORMS[k].filter(a=>!(S.noKids&&a.kids)).forEach(ax=>{let an=0,ad=0;ax.items.forEach((it,j)=>{const[f,i]=S.ans[k][ax.id+j]||[3,3],a=achieved(f,it.neg),wt=(i+it.w)/2;
  rows.push({id:ax.id+j,t:it.t,neg:it.neg,f,a,i,w:it.w,p:pain(a,i),x:impact(a,i,it.w),ax:ax.title});an+=(a-1)*wt;ad+=4*wt});
  num+=an;den+=ad;axes.push({title:ax.title,index:ax.index,pct:Math.round(an/ad*100)})});
 rows.sort((x,y)=>y.x-x.x||y.p-x.p||y.w-x.w);
 return{rows,axes,overall:Math.round(num/den*100),index:axes.find(a=>a.index)};
}
function band(p,isH){

 if(p>=75)return["جيد","--teal"];
 if(p>=60)return["يحتاج اهتماماً","--mid"];
 return["من الأسباب الرئيسية للتوتر","--crit"];
}

  </ol></div>`}

  </section>
  <section class="panel">

async function jInit(){
 jRender();
 const t=setTimeout(()=>{if(J.state==="loading"){J.state="nodb";jRender()}},10000);
 try{if(window.claude&&claude.use){J.db=await claude.use("db");J.user=await claude.use("user")}}catch(e){}
 clearTimeout(t);
 if(!J.db||!J.user){J.state="nodb";return jRender()}
 try{J.uid=await J.user.id();
  const s=await J.db.collection("data/users/"+J.uid).doc("link").get();
  if(s.exists){J.link=s.data();return jConnect()}
 }catch(e){}
 J.state="setup";jRender();
}
function jErr(e){if(e&&e.code==="not_granted"){J.state="nodb"};jRender()}
function jConnect(){
 J.unsub.forEach(u=>u());J.unsub=[];J.state="ready";
 const base="couples/"+J.link.code;
 J.unsub.push(J.db.doc(base+"/meta/info").onSnapshot(s=>{J.meta=s.data()||{};jRefresh()},jErr));
 J.unsub.push(J.db.collection(base+"/issues").orderBy("created","desc").onSnapshot(s=>{J.issues=s.docs.map(d=>({id:d.id,...d.data()}));jRefresh()},jErr));
 J.unsub.push(J.db.collection(base+"/checkins").onSnapshot(s=>{J.checks=s.docs.map(d=>({id:d.id,...d.data()}));jRefresh()},jErr));
 J.unsub.push(J.db.collection(base+"/survey").onSnapshot(s=>{J.sv={};s.docs.forEach(d=>J.sv[d.id]=d.data());jRefresh()},jErr));
 J.unsub.push(J.db.collection(base+"/pact").onSnapshot(s=>{J.pact={};s.docs.forEach(d=>J.pact[d.id]=d.data());jRefresh()},jErr));
 J.unsub.push(J.db.collection(base+"/reasons").onSnapshot(s=>{J.reasons={};s.docs.forEach(d=>J.reasons[d.id]=d.data().text)},jErr));
 J.unsub.push(J.db.collection(base+"/rounds").onSnapshot(s=>{J.rounds=s.docs.map(d=>({id:d.id,...d.data()}));jRefresh()},jErr));
 jRender();
 if(location.hash!=="#journal"&&!S.online){const y=scrollY;render();scrollTo(0,y)}
}
const col=n=>J.db.collection("couples/"+J.link.code+"/"+n);

/* counts that drive the notification badge */
function counts(){
 if(J.state!=="ready")return{reply:0,confirm:0,mine:0,resolvedWeek:0};
 const wk=weekKey();
 return{
  reply:J.issues.filter(i=>i.from===them()&&i.status==="new").length,
  confirm:J.issues.filter(i=>i.from===me()&&i.status!=="new"&&i.status!=="resolved").length,
  mine:J.issues.filter(i=>i.from===me()&&i.status!=="resolved").length,
  resolvedWeek:J.issues.filter(i=>i.status==="resolved"&&i.resolvedAt&&weekKey(i.resolvedAt)===wk).length};
}

async function copy(t){try{await navigator.clipboard.writeText(t);toast("تم النسخ")}catch(e){toast("لم يتم النسخ، حدّد النص وانسخه يدوياً")}}
async function pinHash(u,p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("wifaq:"+u+":"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const USER_RE=/^[a-z0-9][a-z0-9-]{2,23}$/;

const CC=[["974","قطر"],["966","السعودية"],["971","الإمارات"],["965","الكويت"],["973","البحرين"],["968","عُمان"],["962","الأردن"],["20","مصر"],["964","العراق"],["963","سوريا"],["961","لبنان"],["970","فلسطين"],["212","المغرب"],["213","الجزائر"],["216","تونس"],["249","السودان"],["967","اليمن"],["90","تركيا"],["92","باكستان"],["91","الهند"],["44","بريطانيا"],["1","أمريكا وكندا"]];
const dispId=c=>/^p\d+$/.test(c)?"+"+c.slice(1):c;
const digits=v=>String(v||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
function phoneId(cc,num){let n=digits(num).replace(/^0+/,"");if(n.startsWith(cc)&&n.length>cc.length+6)n=n.slice(cc.length);return n.length>=6&&n.length<=12?"p"+cc+n:null}

/* login: the couple shares ONE phone number (or a username); inside it each partner has a sub-path: +974…/husband and +974…/wife */
function setupView(){
 const tab=J.loginTab||"login",isNew=tab==="new";
 jv.innerHTML=`
 <header class="hdr"><span class="eyebrow">بوابة الزوجين</span><h1>${isNew?"مستخدم جديد":"تسجيل الدخول"}</h1>
 <p class="muted">اكتب رقم الهاتف المشترك واختر بجانبه: زوج أو زوجة. من يختار «زوج» يدخل إلى بيانات الزوج واستبيانه، ومن تختار «زوجة» تدخل إلى بيانات الزوجة واستبيانها.</p></header>
 <section class="panel loginbox">
  <div class="seg" role="tablist"><button data-t="login" aria-pressed="${!isNew}">تسجيل الدخول</button><button data-t="new" aria-pressed="${isNew}">مستخدم جديد</button></div>

   <div class="loginrow">
    <div class="phone" dir="ltr"><select id="lcc" aria-label="رمز الدولة">${CC.map(([c,n])=>`<option value="${c}">+${c} ${n}</option>`).join("")}</select><input id="lnum" inputmode="tel" autocomplete="tel-national" placeholder="5512 3456"></div>
    <div class="rolebox" role="radiogroup" aria-label="الدور">
     <input type="radio" name="lrole" id="lr-h" value="h" ${J.loginRole==="w"?"":"checked"}><label for="lr-h">زوج</label>
     <input type="radio" name="lrole" id="lr-w" value="w" ${J.loginRole==="w"?"checked":""}><label for="lr-w">زوجة</label>
    </div>
   </div>
   <span class="sub">رقم واحد يستخدمه الزوجان معاً، مثل رقم الزوج أو رقم البيت.</span></div>
  <div class="field"><label for="lpin">${isNew?"اختر رمز دخول (4 إلى 6 أرقام)":"رمز الدخول"}</label><input id="lpin" inputmode="numeric" dir="ltr" maxlength="6" autocomplete="${isNew?"new-password":"current-password"}"></div>
  <div class="field"><label for="lname">${isNew?"اسمك":"اسمك (عند أول دخول فقط)"}</label><input id="lname"></div>
  ${isNew?"":`<details class="sub"><summary>لديكما حساب باسم مستخدم بدل الرقم؟</summary><div class="field" style="margin-top:6px"><label for="luser">اسم المستخدم</label><input id="luser" dir="ltr" placeholder="ahmad-sara"></div></details>`}
  <button class="primary big" id="lgo">${isNew?"إنشاء الحساب والدخول":"دخول"}</button>
  <p class="err" id="serr" hidden></p>
  <p class="sub">${isNew?"بعد الإنشاء، يدخل الطرف الآخر من «تسجيل الدخول» بنفس الرقم والرمز ويختار دوره.":"أول مرة؟ اختر «مستخدم جديد» إذا لم يُنشأ حساب لهذا الرقم بعد."}</p>
 </section>
 <p class="note">رقم الهاتف معرّف للحساب المشترك فقط، ولا تُرسل إليه رسائل تحقق. الذي يحمي الحساب هو رمز الدخول، فلا تشاركه مع غير زوجك أو زوجتك.</p>`;
 jv.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{J.loginRole=(jv.querySelector("input[name=lrole]:checked")||{}).value;J.loginTab=b.dataset.t;jRender()});
 const err=t=>{const e=document.getElementById("serr");e.textContent=t;e.hidden=false};
 const g=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
 document.getElementById("lgo").onclick=async e=>{
  const role=(jv.querySelector("input[name=lrole]:checked")||{}).value,user=g("luser").toLowerCase(),u=user||phoneId(g("lcc"),g("lnum")),pin=g("lpin"),name=g("lname");
  if(!u)return err("اكتب رقم هاتف صحيحاً واختر رمز الدولة.");
  if(!role)return err("اختر بجانب الرقم: زوج أو زوجة.");
  if(isNew&&!/^\d{4,6}$/.test(pin))return err("رمز الدخول من 4 إلى 6 أرقام.");
  if(!pin)return err("اكتب رمز الدخول.");
  e.target.disabled=true;
  try{const ref=J.db.doc(`couples/${u}/meta/info`),s=await ref.get(),d=s.exists?s.data():null;
   if(isNew){
    if(d){e.target.disabled=false;return err("يوجد حساب بهذا الرقم. اختر «تسجيل الدخول».")}
    await ref.set({[role]:J.uid,["name_"+role]:name||ROLE[role],pin:await pinHash(u,pin),phone:"+"+u.slice(1),created:Date.now()});
   }else{

/* ===== online survey inside the couple account ===== */
let svT;
function onlineSave(k){clearTimeout(svT);svT=setTimeout(()=>{if(!J.link||J.link.role!==k)return;
 col("survey").doc(k).set({ans:S.ans[k],done:false,at:Date.now()}).catch(()=>toast("تعذّر حفظ الإجابة، تحقق من الاتصال"))},900)}
async function onlineDone(k){clearTimeout(svT);
 if(!J.link){toast("تعذّر الحفظ، افتح دفتر الأسبوع وسجّل الدخول");return}
 try{await col("survey").doc(k).set({ans:S.ans[k],done:true,at:Date.now()})}catch(e){toast("تعذّر الحفظ، حاول مرة أخرى");return}
 S=fresh();save();J.sub="sv";location.hash="#journal";jRender();toast("حُفظت إجاباتك في مسارك")}
function startOnline(){const r=me(),d=J.sv[r];S=fresh();S.online=true;S.noKids=!!J.meta.noKids;S.names={h:jn("h"),w:jn("w")};S.ans[r]=(d&&d.ans)||{};
 S.stage="fill-"+r;S.page=0;location.hash="#survey";render()}
function showJointReport(){S=fresh();S.online=true;S.noKids=!!J.meta.noKids;S.names={h:jn("h"),w:jn("w")};S.ans={h:J.sv.h.ans,w:J.sv.w.ans};S.stage="report";location.hash="#survey";render()}
function saveRound(R){if(!J.link||!J.sv.h||!J.sv.w)return;const id="r"+Math.max(J.sv.h.at,J.sv.w.at);
 if(J.rounds.some(x=>x.id===id))return;
 const pack=r=>({overall:r.overall,index:r.index.pct,ax:Object.fromEntries(r.axes.map(a=>[a.title.replace(/\W/g,"_"),a.pct]))});
 col("rounds").doc(id).set({at:Math.max(J.sv.h.at,J.sv.w.at),h:pack(R.h),w:pack(R.w)}).catch(()=>{})}
function svStatus(r){const d=J.sv[r],n=d&&d.ans?Object.values(d.ans).filter(v=>v[0]&&v[1]).length:0,t=FORMS[r].reduce((a,x)=>a+x.items.length,0);
 return d&&d.done?["أكمل الاستبيان","--ok",t,t]:n?[`أجاب عن ${n} من ${t}`,"--mid",n,t]:["لم يبدأ بعد","--muted",0,t]}

  <div class="bar"><i style="width:${n/t*100}%;background:var(${c==="--muted"?"--line":c})"></i></div>
  <p style="color:var(${c})">${st}</p>
  ${r===me()?`<div class="btns"><button class="primary" id="svGo">${J.sv[r]&&J.sv[r].done?"مراجعة إجاباتي":n?"أكمل استبياني":"ابدأ استبياني"}</button></div>`:`<p class="sub">لا تظهر إجاباته لك قبل اكتمال الاستبيانين.</p>`}</section>`};

function lineChart(labels,series,max){
 if(labels.length<2)return"";
 const W=600,H=210,L=34,R=16,T=14,B=30,x=i=>L+i*(W-L-R)/(labels.length-1),y=v=>T+(max-v)*(H-T-B)/max;
 const ticks=[0,.25,.5,.75,1].map(f=>Math.round(f*max));
 return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">
  ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}
  ${labels.map((l,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${l}</text>`).join("")}
  ${series.map(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);
   return`<polyline fill="none" stroke="var(${s.c})" stroke-width="2.5" ${s.dash?'stroke-dasharray="5 4"':""} points="${pts.map(q=>q.join(",")).join(" ")}"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(${s.c})"/>`).join("")}`}).join("")}
  </svg></div><div class="legend">${series.map(s=>`<span><i class="dot" style="background:var(${s.c})"></i>${s.name}</span>`).join("")}</div>`}
const dl=(a,b)=>{if(a==null||b==null)return"";const d=b-a;return d?`<span style="color:var(${d>0?"--ok":"--crit"})">${d>0?"▲ +":"▼ "}${d}</span>`:`<span class="muted">=</span>`};

function wireCards(p){
 p.querySelectorAll(".issue").forEach(card=>{const id=card.dataset.id;let type=null;
  card.onclick=async e=>{const a=e.target.dataset.act;if(!a)return;const ref=col("issues").doc(id);
   if(a==="open"){type=e.target.dataset.type;J.replying=id;const box=card.querySelector(".rbox");box.hidden=false;
    const ta=box.querySelector("textarea");ta.placeholder=REPLY[type].ph;ta.focus();
    card.querySelectorAll('[data-act="open"]').forEach(b=>b.classList.toggle("primary",b===e.target));}
   if(a==="cancel"){J.replying=null;J.dirty=false;jRender()}
   if(a==="send"){const t=card.querySelector("textarea").value.trim();if(!t)return toast("اكتب ردّك أولاً");
    e.target.disabled=true;
    try{await ref.update({status:type,reply:{type,text:t,at:Date.now()}});J.replying=null;J.dirty=false;toast("وصل ردّك");jRender()}
    catch(x){e.target.disabled=false;toast("تعذّر الإرسال، حاول مرة أخرى")}}
   if(a==="resolve"){try{await ref.update({status:"resolved",resolvedAt:Date.now()});toast("رائع، أُغلقت الملاحظة")}catch(x){toast("تعذّر الحفظ")}}
   if(a==="reopen"){const it=J.issues.find(x=>x.id===id);try{await ref.update({status:"new",prevReply:it.reply||null,reply:null});toast(`أُعيدت إلى ${jn(them())}`)}catch(x){toast("تعذّر الحفظ")}}
  }});
}

function urgDue(k,t=Date.now()){const d=new Date(t);

 if(k==="tonight"){d.setHours(21,0,0,0);return d.getTime()>t+36e5?d.getTime():t+2*36e5}
 d.setDate(d.getDate()+1);d.setHours(12,0,0,0);return d.getTime()}

function dueText(i){const m=Math.round((i.due-Date.now())/6e4);
 if(m<=0)return`<b style="color:var(--crit)">تأخر الرد</b>`;
 return m<60?`متبقٍ ${m} دقيقة`:`متبقٍ ${Math.round(m/60)} ساعة`}

  try{
   const out=await sample.json(`You translate the interface of a marriage-satisfaction questionnaire and couples' journal app from Arabic into ${enNames[lang]}.
Rules: translate each string naturally for a ${enNames[lang]} reader; keep personal names, numbers, %, symbols (● ▲ ▼ / · «») and Latin words unchanged; some strings are fragments of one sentence, translate them as fragments; keep the respectful, warm counselling tone; keep wording about intimacy discreet.
Return ONLY a JSON array of ${batch.length} strings in the same order.
${JSON.stringify(batch)}`,{modelTier:"quick"});
   if(!Array.isArray(out))throw 0;
   const add={};batch.forEach((s,i)=>{const t=out[i];if(typeof t==="string"&&t.trim()){I.dict[s]=t.trim();add["k"+h32(s)]={s,t:t.trim()}}});
   persist(lang,add);applyAll();
  }catch(e){if(e&&e.code==="not_granted"){langStat.textContent="Translation was not allowed";break}
   langStat.textContent="Some text could not be translated";}
 }
 if(I.lang===lang&&!I.queue.size)langStat.textContent="";
 I.busy=false;if(I.queue.size)applyAll();
}
async function persist(lang,add){
 try{localStorage.setItem("wifaq-i18n-"+lang,JSON.stringify(I.dict))}catch(e){}
 if(!J.db||!Object.keys(add).length)return;
 const ref=J.db.doc("i18n/"+lang);
 try{await ref.update(add)}catch(e){try{await ref.set(add)}catch(x){}}
}
async function setLang(lang){
 restore();I.queue.clear();I.lang=lang;langSel.value=lang;
 try{localStorage.setItem("wifaq-lang",lang)}catch(e){}
 wrapEl.dir=RTL.has(lang)?"rtl":"ltr";wrapEl.lang=lang;langStat.textContent="";
 if(lang==="ar"){render();if(J.state==="ready")jRender();else jRender();return}
 try{I.dict=JSON.parse(localStorage.getItem("wifaq-i18n-"+lang))||{}}catch(e){I.dict={}}
 applyAll();
 const db=J.db||(window.claude&&claude.use?await claude.use("db").catch(()=>null):null);
 if(db&&I.lang===lang){try{const s=await db.doc("i18n/"+lang).get();
  if(s.exists){Object.values(s.data()).forEach(v=>{if(v&&v.s&&v.t&&!I.dict[v.s])I.dict[v.s]=v.t});restore();applyAll()}}catch(e){}}
}
langSel.onchange=()=>setLang(langSel.value);
if(STANDALONE)document.querySelector(".langbox").hidden=true;
const appEl=document.getElementById("appInfo");
document.getElementById("navApp").onclick=()=>{if(!appEl.hidden){appEl.hidden=true;return}appEl.hidden=false;
 appEl.innerHTML=`<section class="panel"><div class="who"><h2>تثبيت الموقع كتطبيق</h2><button class="ghost" id="appX">إغلاق</button></div>
  <div class="two"><div><h3>آيفون (Safari)</h3><ol class="agenda"><li>افتح الرابط في Safari.</li><li>اضغط زر المشاركة (المربع والسهم للأعلى).</li><li>اختر «إضافة إلى الشاشة الرئيسية» ثم «إضافة».</li></ol></div>
  <div><h3>أندرويد (Chrome)</h3><ol class="agenda"><li>افتح الرابط في Chrome.</li><li>اضغط النقاط الثلاث أعلى الشاشة.</li><li>اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</li></ol></div></div>
  <p class="note">${STANDALONE?"هذه نسخة التطبيق المستقلة، وتعمل دون إنترنت بعد أول فتح.":"تظهر أيقونة على شاشة الجوال تفتح الموقع مباشرة. وتوجد أيضاً نسخة تطبيق مستقلة يمكن رفعها على نطاقك الخاص."}</p></section>`;
 document.getElementById("appX").onclick=()=>appEl.hidden=true;appEl.scrollIntoView({behavior:"smooth"})};
new MutationObserver(()=>{if(I.lang==="ar")return;clearTimeout(I.timer);I.timer=setTimeout(applyAll,60)}).observe(wrapEl,{childList:true,subtree:true});
try{const saved=localStorage.getItem("wifaq-lang");if(saved&&saved!=="ar")setLang(saved)}catch(e){}
</script>
<script>
/* ===== top bar for the survey: husband / wife buttons, printable copy, attach a filled file ===== */
function needed(k){return itemList(k).filter(x=>!(S.noKids&&x.kids))}
function answeredCount(k){return needed(k).filter(x=>{const v=S.ans[k][x.id];return v&&v[0]&&v[1]}).length}
let DL;(async()=>{try{DL=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){DL=null}})();

function surveyBar(){
 const mr=myRole();
 if(S.online&&!mr)return;
 const pc=k=>{if(mr&&k===mr){const d=J.sv[mr],a=(S.online&&S.stage==="fill-"+mr)?S.ans[mr]:(d&&d.ans)||{};return Math.round(needed(k).filter(x=>{const v=a[x.id];return v&&v[0]&&v[1]}).length/needed(k).length*100)}return Math.round(answeredCount(k)/needed(k).length*100)};
 const bothOnline=mr&&J.sv.h&&J.sv.h.done&&J.sv.w&&J.sv.w.done;
 const bar=document.createElement("div");bar.className="sbar";
 bar.innerHTML=`
  ${(mr?[mr]:["h","w"]).map(r=>`<button data-start="${r}" class="${S.stage==="fill-"+r?"on":""}">${mr?(r==="h"?"استبياني (الزوج)":"استبياني (الزوجة)"):(r==="h"?"استبيان الزوج":"استبيان الزوجة")} <small>${pc(r)}%</small></button>`).join("")}
  <span class="sp"></span>
  <button id="bPrint">نسخة للطباعة</button>
  <button id="bUp">إرفاق ملف للتحليل</button>
  ${(mr?bothOnline:isDone("h")&&isDone("w")&&!S.sample)&&S.stage!=="report"?`<button class="primary" id="bRep">التقرير</button>`:""}`;
 app.prepend(bar);
 const panel=document.createElement("div");panel.id="sPanel";panel.hidden=true;bar.after(panel);
 bar.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{
  if(mr)return startOnline();
  const nh=document.getElementById("nh"),nw=document.getElementById("nw"),nk=document.getElementById("nokids");
  if(S.sample){S=fresh()}
  if(nh)S.names.h=nh.value.trim();if(nw)S.names.w=nw.value.trim();if(nk)S.noKids=nk.checked;
  S.stage="fill-"+b.dataset.start;S.page=0;S.showMiss=false;render()});
 const rep=document.getElementById("bRep");if(rep)rep.onclick=()=>{if(mr)return showJointReport();S.stage="report";render()};
 document.getElementById("bPrint").onclick=()=>{panel.hidden=!panel.hidden||panel.dataset.kind!=="print";panel.dataset.kind="print";printPanel(panel)};
 document.getElementById("bUp").onclick=()=>{panel.hidden=!panel.hidden||panel.dataset.kind!=="up";panel.dataset.kind="up";uploadPanel(panel)};
}

function printPanel(p){
 p.innerHTML=`<section class="panel">
  <h3>نسخة للطباعة أو للتعبئة</h3>
  <div class="btns">
   ${(myRole()?[myRole()]:["h","w"]).map(r=>`<button data-dl="html" data-k="${r}">طباعة استبيان ${r==="h"?"الزوج":"الزوجة"}</button><button data-dl="csv" data-k="${r}">ملف Excel ${r==="h"?"للزوج":"للزوجة"}</button>`).join("")}
  </div>
  <ol class="agenda sub">
   <li><b>للطباعة:</b> حمّل الملف، وافتحه في المتصفح، ثم اضغط Ctrl+P (أو مشاركة ← طباعة في الجوال).</li>
   <li>ضع علامة ✓ أو X في مربع واحد لكل خانة. خانة «القوة» ثابتة ولا تُعبّأ.</li>
   <li>بعد التعبئة صوّر الصفحات بوضوح، وارفع الصور من زر «إرفاق ملف للتحليل».</li>
   <li><b>ملف Excel:</b> افتحه، واكتب رقماً من 1 إلى 5 في عمودي «كم يحدث» و«الأهمية»، ثم احفظه CSV وارفعه.</li>
  </ol>
  <p class="err" id="dlErr" hidden></p></section>`;
 p.querySelectorAll("[data-dl]").forEach(b=>b.onclick=async()=>{
  const k=b.dataset.k,kind=b.dataset.dl,who=k==="h"?"husband":"wife";
  const data=kind==="html"?printableHTML(k):csvFor(k),filename=`wifaq-${who}-survey.${kind}`;
  const e=document.getElementById("dlErr");e.hidden=true;
  if(!DL){if(STANDALONE){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:kind==="html"?"text/html":"text/csv"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast("تم التحميل");return}
   e.textContent="التحميل غير متاح في هذا العرض. افتح الصفحة في claude.ai وأنت مسجّل الدخول.";e.hidden=false;return}
  try{await DL.save({filename,data});toast("جاهز للحفظ")}catch(x){if(x&&x.code==="declined")return;e.textContent="تعذّر تجهيز الملف. حاول مرة أخرى.";e.hidden=false}});
}

function printableHTML(k){
 const L=itemList(k),who=k==="h"?"الزوج يقيّم الزوجة":"الزوجة تقيّم الزوج",name=nm(k);
 const box=`<span class="b"></span>`,boxes=[1,2,3,4,5].map(n=>`<span class="c">${box}<i>${n}</i></span>`).join("");
 let rows="",last="";
 L.forEach(x=>{if(x.ax!==last){rows+=`<tr class="ax"><td colspan="5">${x.ax}${x.kids?" (تخطَّه إن لم يكن لديكما أبناء)":""}</td></tr>`;last=x.ax}
  rows+=`<tr><td class="n">${x.n}</td><td class="t">${x.t}${x.neg?' <span class="neg">سلبي</span>':""}</td><td class="g">${boxes}</td><td class="g">${boxes}</td><td class="w">${x.w}</td></tr>`});
 return`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>استبيان ${who}</title><style>
 @page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:11px;color:#111;margin:0;padding:12px}
 h1{font-size:17px;margin:0 0 4px}p{margin:2px 0}.meta{display:flex;gap:24px;margin:8px 0;font-size:12px}.meta span{border-bottom:1px solid #999;min-width:160px;display:inline-block}
 table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid #bbb;padding:4px 5px;vertical-align:middle}th{background:#eee;font-size:10px}
 tr{page-break-inside:avoid}.ax td{background:#e6efed;font-weight:bold;font-size:11.5px}.n{width:24px;text-align:center;font-weight:bold}.w{width:34px;text-align:center;border-inline-start:2px solid #555}
 .g{width:122px;white-space:nowrap;text-align:center}.c{display:inline-flex;flex-direction:column;align-items:center;margin:0 2px}.b{width:14px;height:14px;border:1.5px solid #333;display:block}.c i{font-style:normal;font-size:8px}
 .neg{font-size:8px;border:1px solid #a33;color:#a33;border-radius:6px;padding:0 3px}.legend{font-size:10px;color:#333;margin-top:4px}
 </style></head><body>
 <h1>ميزان الوفاق الزوجي · استبيان ${who}</h1>
 <div class="meta"><div>الاسم: <span>${esc(name)}</span></div><div>التاريخ: <span></span></div></div>
 <p class="legend"><b>كم يحدث:</b> 1 أبداً · 2 نادراً · 3 أحياناً · 4 غالباً · 5 دائماً &nbsp;|&nbsp; <b>الأهمية لي:</b> 1 غير مهم · 2 قليل · 3 متوسط · 4 مهم · 5 أساسي &nbsp;|&nbsp; <b>القوة:</b> الوزن العالمي للبند (لا يُعبّأ)</p>
 <p class="legend">ضع علامة واضحة في مربع واحد لكل خانة. بعد التعبئة صوّر الصفحات وارفعها في الموقع من «إرفاق ملف للتحليل».</p>
 <table><thead><tr><th>#</th><th>العبارة</th><th>كم يحدث</th><th>الأهمية لي</th><th>القوة</th></tr></thead><tbody>${rows}</tbody></table>
 </body></html>`;
}
const csvCell=v=>{v=String(v??"");return/[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
function csvFor(k){
 const head=["الرقم","الرمز","المحور","العبارة","كم يحدث (1-5)","الأهمية (1-5)","قوة النقطة"];
 const rows=itemList(k).map(x=>{const v=S.ans[k][x.id]||[];return[x.n,k+"."+x.id,x.ax,x.t,v[0]||"",v[1]||"",x.w]});
 return"﻿"+[head,...rows].map(r=>r.map(csvCell).join(",")).join("\r\n");
}
function parseCSV(t){const rows=[];let row=[],cell="",q=false;t=t.replace(/^﻿/,"");
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
  else if(c==='"')q=true;else if(c===","||c===";"||c==="\t"){row.push(cell);cell=""}
  else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell=""}else if(c!=="\r")cell+=c}
 if(cell||row.length){row.push(cell);rows.push(row)}return rows}
const toNum=v=>{v=String(v||"").trim().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));const n=parseInt(v,10);return n>=1&&n<=5?n:0};

function uploadPanel(p){
 p.innerHTML=`<section class="panel">
  <h3>إرفاق استبيان معبّأ للتحليل</h3>
  <div class="chips">${(myRole()?[myRole()]:["h","w"]).map((r,i)=>`<input type="radio" name="upK" id="up${r}" value="${r}" ${i===0?"checked":""}><label for="up${r}">استبيان ${r==="h"?"الزوج":"الزوجة"}</label>`).join("")}</div>
  <div class="field"><label for="upFile">صور الورق المعبّأ (يمكن اختيار عدة صفحات)، أو ملف Excel بصيغة CSV</label>
   <input type="file" id="upFile" accept=".csv,text/csv,image/*" multiple></div>
  <p class="sub">تُقرأ الصور بالذكاء الاصطناعي، فاحرص على أن تكون واضحة ومستقيمة. بعد القراءة راجع الإجابات وصحّح أي خطأ قبل الإنهاء.</p>
  <p id="upMsg" class="sub"></p></section>`;
 document.getElementById("upFile").onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;
  if(S.sample){const n=S.names;S=fresh();S.names=n}
  const k=p.querySelector("input[name=upK]:checked").value,msg=document.getElementById("upMsg"),L=itemList(k);
  const imgs=files.filter(f=>f.type.startsWith("image/")),csvs=files.filter(f=>!f.type.startsWith("image/"));
  let got=0;
  try{
   for(const f of csvs){const rows=parseCSV(await f.text());
    rows.slice(1).forEach(r=>{const code=(r[1]||"").trim(),id=code.includes(".")?code.split(".")[1]:null,num=+r[0];
     const x=L.find(y=>y.id===id)||L.find(y=>y.n===num);const a=toNum(r[4]),i=toNum(r[5]);
     if(x&&a&&i){S.ans[k][x.id]=[a,i];got++}})}
   if(imgs.length){msg.textContent="⏳ جارٍ قراءة الصور…";
    const sample=window.claude&&claude.use?await claude.use("sample"):null;
    if(!sample){msg.textContent="قراءة الصور تحتاج فتح الصفحة في claude.ai وأنت مسجّل الدخول. يمكنك رفع ملف CSV بدلاً منها.";return}
    const lim=await sample.limits(),max=(lim.images&&lim.images.maxCount)||1;
    if(!lim.images){msg.textContent="قراءة الصور غير متاحة هنا. ارفع ملف CSV بدلاً منها.";return}
    for(let s0=0;s0<imgs.length;s0+=max){
     const out=await sample.json(`These photos show pages of a printed Arabic questionnaire. Each numbered row has a statement, then two groups of five boxes numbered 1-5: first group "كم يحدث" (how often), second group "الأهمية لي" (importance). The last column "القوة" is printed, ignore it.
For every row number visible, read which single box is marked in each group (tick, X, circle, fill or scribble). If a group has no clear mark, use null.
Return ONLY a JSON object like {"1":[4,5],"2":[2,null]} keyed by the row number.
Rows on the form: ${L.map(x=>x.n+". "+x.t).join(" | ")}`,{images:imgs.slice(s0,s0+max),modelTier:"complex"});
     Object.entries(out||{}).forEach(([n,v])=>{const x=L.find(y=>y.n===+n);if(x&&Array.isArray(v)){const a=toNum(v[0]),i=toNum(v[1]);if(a&&i){S.ans[k][x.id]=[a,i];got++}}})}}
  }catch(x){msg.textContent=x&&x.code==="not_granted"?"لم يُسمح بقراءة الصور.":"تعذّرت قراءة الملف. تأكد من وضوح الصور أو من صيغة الملف.";return}
  const left=needed(k).length-answeredCount(k);
  if(myRole()===k){const a=S.ans[k];S.online=true;S.names={h:jn("h"),w:jn("w")};S.noKids=!!J.meta.noKids;S.ans[k]=a;onlineSave(k)}
  S.stage="fill-"+k;S.page=0;S.showMiss=left>0;save();render();
  toast(left?`قُرئت ${got} إجابة. راجعها وأكمل ${left} سؤالاً ناقصاً`:`قُرئت ${got} إجابة. راجعها ثم اضغط «إنهاء الاستبيان»`);
 };
}
render();
</script>
